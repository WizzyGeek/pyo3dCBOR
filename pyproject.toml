[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "dcbor"
version = "0.1.1"
description = "Deterministic CBOR (dCBOR) for Python with a native Rust implementation"
readme = "README.md"
license = { text = "BSD-2-Clause-Patent" }
requires-python = ">=3.9"
maintainers = [{ name = "WizzyGeek" }]
keywords = ["cbor", "dcbor", "encoding", "serialization", "deterministic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]

[project.urls]
"Source" = "https://github.com/WizzyGeek/pyo3dCBOR"
"Issues" = "https://github.com/WizzyGeek/pyo3dCBOR/issues"
"Upstream (Rust)" = "https://github.com/BlockchainCommons/bc-dcbor-rust"

[tool.maturin]
python-source = "python"
module-name = "dcbor._dcbor"
features = ["pyo3/extension-module"]
locked = true
include = [
    { path = "containers/linux/*.sh", format = "sdist" },
    { path = "containers/linux/images.json", format = "sdist" },
    { path = "scripts/**/*.py", format = "sdist" },
    { path = "tests/**/*.py", format = "sdist" },
    { path = "pytest.ini", format = "sdist" },
]
exclude = ["maintenance/**"]

[tool.cibuildwheel]
# Regular CPython only: no implicit additions when new interpreters appear.
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
archs = ["native"]
build-frontend = "build"
test-requires = ["pytest>=8,<9"]
test-command = 'python -m pytest {project}/tests -q -m "not exhaustive"'

[tool.cibuildwheel.environment]
CARGO_BUILD_JOBS = "2"

[tool.cibuildwheel.linux]
# cibuildwheel resolves these image families to versioned images.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh && sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.90.0"
environment = { PATH = "$HOME/.cargo/bin:$PATH", CARGO_BUILD_JOBS = "2" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", CARGO_BUILD_JOBS = "2" }
