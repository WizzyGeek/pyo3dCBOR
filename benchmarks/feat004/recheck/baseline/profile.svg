e><polygon points="919.12,589.00 924.12,594.00 919.12,599.00 914.12,594.00" fill="#C94E47"><title>unicode_nfc: decode median 49,175 ns/op; wire 9219 B</title></polygon><text x="1122" y="595.0" text-anchor="middle" class="case-value">9,219</text><line x1="670" y1="605.0" x2="1236" y2="605.0" class="rule" /><text x="670" y="629.0" class="case-label">Decomposed</text><circle cx="1017.74" cy="620.00" r="5" fill="#08766F"><title>unicode_decomposed: encode median 256,469 ns/op; wire 9219 B</title></circle><polygon points="918.91,623.00 923.91,628.00 918.91,633.00 913.91,628.00" fill="#C94E47"><title>unicode_decomposed: decode median 49,006 ns/op; wire 9219 B</title></polygon><text x="1122" y="629.0" text-anchor="middle" class="case-value">9,219</text><line x1="670" y1="639.0" x2="1236" y2="639.0" class="rule" /><text x="670" y="663.0" class="case-label">Expanding NFC</text><circle cx="946.03" cy="654.00" r="5" fill="#08766F"><title>unicode_expanding_nfc: encode median 77,179 ns/op; wire 3075 B</title></circle><polygon points="931.84,657.00 936.84,662.00 931.84,667.00 926.84,662.00" fill="#C94E47"><title>unicode_expanding_nfc: decode median 60,850 ns/op; wire 3075 B</title></polygon><text x="1122" y="663.0" text-anchor="middle" class="case-value">3,075</text><line x1="670" y1="673.0" x2="1236" y2="673.0" class="rule" /><text x="961.5" y="712" text-anchor="middle" class="axis">Median time · µs, log</text>
