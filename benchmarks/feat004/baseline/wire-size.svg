<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="798" viewBox="0 0 1320 798" role="img" aria-labelledby="title desc">
  <title id="title">Wire size across codec families</title>
  <desc id="desc">Compact JSON is the 100 percent baseline. dCBOR and strict DAG-CBOR use exact points; the CBOR, orjson, and msgspec families use explicit min–max ranges across their named modes. Family lanes are vertically offset to keep overlapping measurements readable. Table columns show bytes, while plot tooltips retain each individual mode value and status.</desc>
  <style>
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #142B39; }
  .title { font-size: 27px; font-weight: 740; letter-spacing: -0.45px; }
  .subtitle { font-size: 15px; fill: #586D79; }
  .caption { font-size: 13px; fill: #586D79; }
  .fixture { font-size: 16px; font-weight: 650; }
  .small { font-size: 14px; fill: #586D79; }
  .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { fill: #586D79; }
  .card { fill: #FFFFFF; stroke: #E0E7EA; stroke-width: 1; }
  .rule { stroke: #E0E7EA; stroke-width: 1; }
  .legend { font-size: 15px; fill: #435967; }
  .column-head { font-size: 14px; fill: #586D79; font-weight: 650; }
  .axis { font-size: 14px; fill: #586D79; font-variant-numeric: tabular-nums; }

    .hero { font-size: 30px; font-weight: 760; letter-spacing: -0.55px; }
    .dek { font-size: 15px; fill: #586D79; }
    .row-label { font-size: 15px; font-weight: 620; }
    .bytes { font-size: 13px; font-variant-numeric: tabular-nums; }
