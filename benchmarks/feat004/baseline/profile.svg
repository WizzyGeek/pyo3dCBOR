ext-anchor="middle" class="case-value">643</text><line x1="48" y1="639.0" x2="614" y2="639.0" class="rule" /><text x="48" y="663.0" class="case-label">Boundaries</text><circle cx="236.26" cy="654.00" r="5" fill="#08766F"><title>float_boundaries: encode median 17,748 ns/op; wire 1955 B</title></circle><polygon points="231.37,657.00 236.37,662.00 231.37,667.00 226.37,662.00" fill="#C94E47"><title>float_boundaries: decode median 16,354 ns/op; wire 1955 B</title></polygon><text x="500" y="663.0" text-anchor="middle" class="case-value">1,955</text><line x1="48" y1="673.0" x2="614" y2="673.0" class="rule" /><text x="339.5" y="712" text-anchor="middle" class="axis">Median time · µs, log</text><text x="670" y="520" class="panel-title">Unicode normalization</text><text x="1122" y="520" text-anchor="middle" class="column-head">Wire B</text><line x1="824.00" y1="531" x2="824.00" y2="675" stroke="#E0E7EA" stroke-dasharray="2 5" /><text x="824.00" y="693" text-anchor="middle" class="axis">10</text><line x1="961.50" y1="531" x2="961.50" y2="675" stroke="#E0E7EA" stroke-dasharray="2 5" /><text x="961.50" y="693" text-anchor="middle" class="axis">100</text><line x1="1099.00" y1="531" x2="1099.00" y2="675" stroke="#E0E7EA" stroke-dasharray="2 5" /><text x="1099.00" y="693" text-anchor="middle" class="axis">1000</text><text x="670" y="561.0" class="case-label">ASCII</text><circle cx="889.48" cy="552.00" r="5" fill="#08766F"><title>unicode_ascii: encode median 29,937 ns/op; wire 11523 B</title></circle><polygon points="889.00,555.00 894.00,560.00 889.00,565.00 884.00,560.00" fill="#C94E47"><title>unicode_ascii: decode median 29,696 ns/op; wire 11523 B</title></polygon><text x="1122" y="561.0" text-anchor="middle" class="case-value">11,523</text><line x1="670" y1="571.0" x2="1236" y2="571.0" class="rule" /><text x="670" y="595.0" class="case-label">NFC</text><circle cx="1020.99" cy="586.00" r="5" fill="#08766F"><title>unicode_nfc: encode median 270,826 ns/op; wire 9219 B</title></circle><polygon points="921.08,589.00 926.08,594.00 921.08,599.00 916.08,594.00" fill="#C94E47"><title>unicode_nfc: decode median 50,821 ns/op; wire 9219 B</title></polygon><text x="1122" y="595.0" text-anchor="middle" class="case-value">9,219</text><line x1="670" y1="605.0" x2="1236" y2="605.0" class="rule" /><text x="670" y="629.0" class="case-label">Decomposed</text><circle cx="1020.05" cy="620.00" r="5" fill="#08766F"><title>unicode_decomposed: encode median 266,561 ns/op; wire 9219 B</title></circle><polygon points="920.42,623.00 925.42,628.00 920.42,633.00 915.42,628.00" fill="#C94E47"><title>unicode_decomposed: decode median 50,260 ns/op; wire 9219 B</title></polygon><text x="1122" y="629.0" text-anchor="middle" class="case-value">9,219</text><line x1="670" y1="639.0" x2="1236" y2="639.0" class="rule" /><text x="670" y="663.0" class="case-label">Expanding NFC</text><circle cx="948.23" cy="654.00" r="5" fill="#08766F"><title>unicode_expanding_nfc: encode median 80,077 ns/op; wire 3075 B</title></circle><polygon points="933.47,657.00 938.47,662.00 933.47,667.00 928.47,662.00" fill="#C94E47"><title>unicode_expanding_nfc: decode median 62,540 ns/op; wire 3075 B</title></polygon><text x="1122" y="663.0" text-anchor="middle" class="case-value">3,075</text><line x1="670" y1="673.0" x2="1236" y2="673.0" class="rule" /><text x="961.5" y="712" text-anchor="middle" class="axis">Median time · µs, log</text>
