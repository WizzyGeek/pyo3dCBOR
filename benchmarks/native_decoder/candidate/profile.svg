<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">dCBOR profile: map scale, floats, and Unicode</title>
  <desc id="desc">The map panel plots median encode time against map entry count on logarithmic axes, separately for sorted, reverse, and shuffled insertion order. Float and Unicode panels show encode and decode median times as separate marks on a shared logarithmic microsecond scale, with each case's exact encoded wire bytes. Workloads have different semantics and payload sizes; ratios between those cases are not implied. Tooltips and the profile JSON retain exact medians and MAD.</desc>
  <style>
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #142B39; }
  .title { font-size: 27px; font-weight: 740; letter-spacing: -0.45px; }
  .subtitle { font-size: 15px; fill: #586D79; }
  .caption { font-size: 13px; fill: #586D79; }
  .fixture { font-size: 16px; font-weight: 650; }
  .small { font-size: 14px; fill: #586D79; }
  .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { fill: #586D79; }
  .card { fill: #FFFFFF; stroke: #E0E7EA; stroke-width: 1; }
  .rule { stroke: #E0E7EA; stroke-width: 1; }
  .legend { font-size: 15px; fill: #435967; }
  .column-head { font-size: 14px; fill: #586D79; font-weight: 650; }
  .axis { font-size: 14px; fill: #586D79; font-variant-numeric: tabular-nums; }

    .hero { font-size: 30px; font-weight: 760; letter-spacing: -0.55px; }
    .dek { font-size: 15px; fill: #586D79; }
    .panel-title { font-size: 19px; font-weight: 720; }
    .case-label { font-size: 14px; font-weight: 590; }
    .case-value { font-size: 14px; font-variant-numeric: tabular-nums; }
  </style>
  <rect width="1300" height="760" fill="#FFFFFF" />
  <text x="48" y="45" class="hero">dCBOR profile: map scale, floats, and Unicode</text>
  <text x="48" y="72" class="dek">Map encode time scales with entry count and key order · lower panels show each case directly, not as unequal-size ratios</text>
  <text x="48" y="126" class="panel-title">Map encode scaling</text>
  <circle cx="257" cy="121" r="5" fill="#08766F" /><text x="269" y="126" class="legend">Sorted</text>
  <rect x="371" y="116" width="10" height="10" fill="#255B75" /><text x="389" y="126" class="legend">Reverse</text>
  <polygon points="503,115 509,126 497,126" fill="#C94E47" /><text x="517" y="126" class="legend">Shuffled</text>
