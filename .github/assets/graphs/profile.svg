  <rect x="371" y="116" width="10" height="10" fill="#255B75" /><text x="389" y="126" class="legend">Reverse</text>
  <polygon points="503,115 509,126 497,126" fill="#C94E47" /><text x="517" y="126" class="legend">Shuffled</text>
