e><polygon points="920.61,589.00 925.61,594.00 920.61,599.00 915.61,594.00" fill="#C94E47"><title>unicode_nfc: decode median 50,419 ns/op; wire 9219 B</title></polygon><text x="1122" y="595.0" text-anchor="middle" class="case-value">9,219</text><line x1="670" y1="605.0" x2="1236" y2="605.0" class="rule" /><text x="670" y="629.0" class="case-label">Decomposed</text><circle cx="1019.82" cy="620.00" r="5" fill="#08766F"><title>unicode_decomposed: encode median 265,539 ns/op; wire 9219 B</title></circle><polygon points="920.68,623.00 925.68,628.00 920.68,633.00 915.68,628.00" fill="#C94E47"><title>unicode_decomposed: decode median 50,479 ns/op; wire 9219 B</title></polygon><text x="1122" y="629.0" text-anchor="middle" class="case-value">9,219</text><line x1="670" y1="639.0" x2="1236" y2="639.0" class="rule" /><text x="670" y="663.0" class="case-label">Expanding NFC</text><circle cx="948.96" cy="654.00" r="5" fill="#08766F"><title>unicode_expanding_nfc: encode median 81,064 ns/op; wire 3075 B</title></circle><polygon points="935.04,657.00 940.04,662.00 935.04,667.00 930.04,662.00" fill="#C94E47"><title>unicode_expanding_nfc: decode median 64,202 ns/op; wire 3075 B</title></polygon><text x="1122" y="663.0" text-anchor="middle" class="case-value">3,075</text><line x1="670" y1="673.0" x2="1236" y2="673.0" class="rule" /><text x="961.5" y="712" text-anchor="middle" class="axis">Median time · µs, log</text>
