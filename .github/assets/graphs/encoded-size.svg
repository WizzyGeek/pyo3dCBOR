<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="594" viewBox="0 0 1100 594" role="img" aria-labelledby="title desc">
  <title id="title">Compact JSON and dCBOR payload size comparison</title>
  <desc id="desc">A normalized dumbbell plot compares dCBOR with compact UTF-8 JSON across 8 fixtures. JSON is 100 percent; dCBOR points left when it uses fewer bytes and right when it uses more. Exact byte counts and percentage differences are printed for every fixture. 7 of 8 fixtures are smaller with dCBOR.</desc>
  <style>
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #142B39; }
  .title { font-size: 27px; font-weight: 740; letter-spacing: -0.45px; }
  .subtitle { font-size: 15px; fill: #586D79; }
  .caption { font-size: 13px; fill: #586D79; }
  .fixture { font-size: 16px; font-weight: 650; }
  .small { font-size: 14px; fill: #586D79; }
  .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { fill: #586D79; }
  .card { fill: #FFFFFF; stroke: #E0E7EA; stroke-width: 1; }
  .rule { stroke: #E0E7EA; stroke-width: 1; }
  .legend { font-size: 15px; fill: #435967; }
  .column-head { font-size: 14px; fill: #586D79; font-weight: 650; }
  .axis { font-size: 14px; fill: #586D79; font-variant-numeric: tabular-nums; }

    .hero { font-size: 30px; font-weight: 760; letter-spacing: -0.55px; }
    .dek { font-size: 16px; fill: #586D79; }
    .row-label { font-size: 16px; font-weight: 620; }
    .bytes { font-size: 15px; font-variant-numeric: tabular-nums; }
    .delta { font-size: 20px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .axis { font-size: 13px; fill: #586D79; }
  </style>
  <rect width="1100" height="594" fill="#FFFFFF" />
  <text x="48" y="51" class="hero">dCBOR uses fewer bytes in 7 of 8 fixtures</text>
  <text x="48" y="81" class="dek">Compact UTF-8 JSON = 100% · dCBOR left of 100% uses fewer bytes</text>
  <line x1="48" y1="119" x2="78" y2="119" stroke="#B8C7CE" stroke-width="3" />
  <circle cx="48" cy="119" r="6" fill="#255B75" />
  <text x="90" y="124" class="legend">Compact JSON · 100%</text>
  <circle cx="278" cy="119" r="7" fill="#08766F" />
  <text x="295" y="124" class="legend">dCBOR</text>
  <circle cx="391" cy="119" r="7" fill="#C94E47" />
  <text x="408" y="124" class="legend">dCBOR increase</text>
  <text x="728" y="148" class="column-head">JSON → dCBOR bytes</text>
  <text x="1052" y="148" text-anchor="end" class="column-head">Change</text>
  <line x1="322.00" y1="161" x2="322.00" y2="498" stroke="#E0E7EA" stroke-width="1" stroke-dasharray="2 5" /><text x="322.00" y="524" text-anchor="middle" class="axis">50%</text><line x1="417.00" y1="161" x2="417.00" y2="498" stroke="#E0E7EA" stroke-width="1" stroke-dasharray="2 5" /><text x="417.00" y="524" text-anchor="middle" class="axis">75%</text><line x1="512.00" y1="161" x2="512.00" y2="498" stroke="#142B39" stroke-width="2" stroke-dasharray="0" /><text x="512.00" y="524" text-anchor="middle" class="axis">100%</text><line x1="607.00" y1="161" x2="607.00" y2="498" stroke="#E0E7EA" stroke-width="1" stroke-dasharray="2 5" /><text x="607.00" y="524" text-anchor="middle" class="axis">125%</text><line x1="702.00" y1="161" x2="702.00" y2="498" stroke="#E0E7EA" stroke-width="1" stroke-dasharray="2 5" /><text x="702.00" y="524" text-anchor="middle" class="axis">150%</text>
  <line x1="48" y1="210.0" x2="1052" y2="210.0" class="rule" /><text x="48" y="196.0" class="row-label">Small record</text><line x1="373.15" y1="190.0" x2="512.00" y2="190.0" stroke="#B8C7CE" stroke-width="3" /><circle cx="512.00" cy="190.0" r="7" fill="#255B75" /><circle cx="373.15" cy="190.0" r="8" fill="#08766F" stroke="#FFFFFF" stroke-width="2"><title>Small record: JSON 52 B, dCBOR 33 B, −36.54%</title></circle><text x="728" y="196.0" class="bytes">52 B <tspan class="muted">→</tspan> 33 B</text><text x="1052" y="197.0" text-anchor="end" class="delta" fill="#08766F">−36.54%</text><line x1="48" y1="252.0" x2="1052" y2="252.0" class="rule" /><text x="48" y="238.0" class="row-label">Nested document</text><line x1="393.64" y1="232.0" x2="512.00" y2="232.0" stroke="#B8C7CE" stroke-width="3" /><circle cx="512.00" cy="232.0" r="7" fill="#255B75" /><circle cx="393.64" cy="232.0" r="8" fill="#08766F" stroke="#FFFFFF" stroke-width="2"><title>Nested document: JSON 122 B, dCBOR 84 B, −31.15%</title></circle><text x="728" y="238.0" class="bytes">122 B <tspan class="muted">→</tspan> 84 B</text><text x="1052" y="239.0" text-anchor="end" class="delta" fill="#08766F">−31.15%</text><line x1="48" y1="294.0" x2="1052" y2="294.0" class="rule" /><text x="48" y="280.0" class="row-label">Repeated Unicode strings</text><line x1="409.40" y1="274.0" x2="512.00" y2="274.0" stroke="#B8C7CE" stroke-width="3" /><circle cx="512.00" cy="274.0" r="7" fill="#255B75" /><circle cx="409.40" cy="274.0" r="8" fill="#08766F" stroke="#FFFFFF" stroke-width="2"><title>Repeated Unicode strings: JSON 1,537 B, dCBOR 1,122 B, −27.00%</title></circle><text x="728" y="280.0" class="bytes">1,537 B <tspan class="muted">→</tspan> 1,122 B</text><text x="1052" y="281.0" text-anchor="end" class="delta" fill="#08766F">−27.00%</text><line x1="48" y1="336.0" x2="1052" y2="336.0" class="rule" /><text x="48" y="322.0" class="row-label">Numeric array</text><line x1="421.32" y1="316.0" x2="512.00" y2="316.0" stroke="#B8C7CE" stroke-width="3" /><circle cx="512.00" cy="316.0" r="7" fill="#255B75" /><circle cx="421.32" cy="316.0" r="8" fill="#08766F" stroke="#FFFFFF" stroke-width="2"><title>Numeric array: JSON 901 B, dCBOR 686 B, −23.86%</title></circle><text x="728" y="322.0" class="bytes">901 B <tspan class="muted">→</tspan> 686 B</text><text x="1052" y="323.0" text-anchor="end" class="delta" fill="#08766F">−23.86%</text><line x1="48" y1="378.0" x2="1052" y2="378.0" class="rule" /><text x="48" y="364.0" class="row-label">Compact scientific notation</text><line x1="512.00" y1="358.0" x2="613.33" y2="358.0" stroke="#B8C7CE" stroke-width="3" /><circle cx="512.00" cy="358.0" r="7" fill="#255B75" /><circle cx="613.33" cy="358.0" r="8" fill="#C94E47" stroke="#FFFFFF" stroke-width="2"><title>Compact scientific notation: JSON 15 B, dCBOR 19 B, +26.67%</title></circle><text x="728" y="364.0" class="bytes">15 B <tspan class="muted">→</tspan> 19 B</text><text x="1052" y="365.0" text-anchor="end" class="delta" fill="#C94E47">+26.67%</text><line x1="48" y1="420.0" x2="1052" y2="420.0" class="rule" /><text x="48" y="406.0" class="row-label">Large collection</text><line x1="387.18" y1="400.0" x2="512.00" y2="400.0" stroke="#B8C7CE" stroke-width="3" /><circle cx="512.00" cy="400.0" r="7" fill="#255B75" /><circle cx="387.18" cy="400.0" r="8" fill="#08766F" stroke="#FFFFFF" stroke-width="2"><title>Large collection: JSON 8,442 B, dCBOR 5,669 B, −32.85%</title></circle><text x="728" y="406.0" class="bytes">8,442 B <tspan class="muted">→</tspan> 5,669 B</text><text x="1052" y="407.0" text-anchor="end" class="delta" fill="#08766F">−32.85%</text><line x1="48" y1="462.0" x2="1052" y2="462.0" class="rule" /><text x="48" y="448.0" class="row-label">Telemetry batch</text><line x1="406.75" y1="442.0" x2="512.00" y2="442.0" stroke="#B8C7CE" stroke-width="3" /><circle cx="512.00" cy="442.0" r="7" fill="#255B75" /><circle cx="406.75" cy="442.0" r="8" fill="#08766F" stroke="#FFFFFF" stroke-width="2"><title>Telemetry batch: JSON 6,860 B, dCBOR 4,960 B, −27.70%</title></circle><text x="728" y="448.0" class="bytes">6,860 B <tspan class="muted">→</tspan> 4,960 B</text><text x="1052" y="449.0" text-anchor="end" class="delta" fill="#08766F">−27.70%</text><line x1="48" y1="504.0" x2="1052" y2="504.0" class="rule" /><text x="48" y="490.0" class="row-label">ASCII article</text><line x1="508.14" y1="484.0" x2="512.00" y2="484.0" stroke="#B8C7CE" stroke-width="3" /><circle cx="512.00" cy="484.0" r="7" fill="#255B75" /><circle cx="508.14" cy="484.0" r="8" fill="#08766F" stroke="#FFFFFF" stroke-width="2"><title>ASCII article: JSON 5,019 B, dCBOR 4,968 B, −1.02%</title></circle><text x="728" y="490.0" class="bytes">5,019 B <tspan class="muted">→</tspan> 4,968 B</text><text x="1052" y="491.0" text-anchor="end" class="delta" fill="#08766F">−1.02%</text>
  <text x="48" y="571" class="caption">Each row shares one percent axis. Positive change marks the scientific-notation size loss; details and hashes are in the report.</text>
</svg>
