<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="844" viewBox="0 0 1120 844" role="img" aria-labelledby="title desc">
  <title id="title">Rust core and Python dCBOR whole-operation timing</title>
  <desc id="desc">Encode and decode panels compare paired Rust core and Python dCBOR medians for each fixture. Ratios are Rust core divided by Python dCBOR; lower than one means the Rust path took less time in this measurement. This compares whole operations: Python conversion is included, Rust CBOR trees are prebuilt, and it is not an isolated FFI benchmark.</desc>
  <style>
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #142B39; }
  .title { font-size: 27px; font-weight: 740; letter-spacing: -0.45px; }
  .subtitle { font-size: 15px; fill: #586D79; }
  .caption { font-size: 13px; fill: #586D79; }
  .fixture { font-size: 16px; font-weight: 650; }
  .small { font-size: 14px; fill: #586D79; }
  .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { fill: #586D79; }
  .card { fill: #FFFFFF; stroke: #E0E7EA; stroke-width: 1; }
  .rule { stroke: #E0E7EA; stroke-width: 1; }
  .legend { font-size: 15px; fill: #435967; }
  .column-head { font-size: 14px; fill: #586D79; font-weight: 650; }
  .axis { font-size: 14px; fill: #586D79; font-variant-numeric: tabular-nums; }

    .hero { font-size: 30px; font-weight: 760; letter-spacing: -0.55px; }
    .dek { font-size: 15px; fill: #586D79; }
    .operation { font-size: 20px; font-weight: 720; }
    .ratio-value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  </style>
  <rect width="1120" height="844" fill="#FFFFFF" />
  <text x="48" y="45" class="hero">Rust core vs Python dCBOR</text>
  <text x="48" y="73" class="dek">Paired fixture medians · Rust/Python ratio · lower than 1× means less elapsed time in this run</text>
  <line x1="54" y1="105" x2="100" y2="105" stroke="#08766F" stroke-width="3" /><circle cx="100" cy="105" r="5" fill="#08766F" />
  <text x="113" y="110" class="legend">Below baseline: Rust core took less time</text>
  <line x1="408" y1="105" x2="454" y2="105" stroke="#C94E47" stroke-width="3" /><circle cx="454" cy="105" r="5" fill="#C94E47" />
  <text x="467" y="110" class="legend">Above baseline: Python dCBOR took less time</text>
  <text x="48" y="176" class="operation">Encode</text><text x="836" y="176" class="column-head">Rust core / Python ratio</text><line x1="48" y1="461" x2="1072" y2="461" class="rule" /><line x1="330.00" y1="188" x2="330.00" y2="456" stroke="#E0E7EA" stroke-width="1" stroke-dasharray="2 5" /><text x="330.00" y="203" text-anchor="middle" class="axis">0.12×</text><line x1="483.33" y1="188" x2="483.33" y2="456" stroke="#E0E7EA" stroke-width="1" stroke-dasharray="2 5" /><text x="483.33" y="203" text-anchor="middle" class="axis">0.5×</text><line x1="560.00" y1="188" x2="560.00" y2="456" stroke="#142B39" stroke-width="2" stroke-dasharray="0" /><text x="560.00" y="203" text-anchor="middle" class="axis">1×</text><line x1="636.67" y1="188" x2="636.67" y2="456" stroke="#E0E7EA" stroke-width="1" stroke-dasharray="2 5" /><text x="636.67" y="203" text-anchor="middle" class="axis">2×</text><line x1="790.00" y1="188" x2="790.00" y2="456" stroke="#E0E7EA" stroke-width="1" stroke-dasharray="2 5" /><text x="790.00" y="203" text-anchor="middle" class="axis">8×</text><text x="48" y="220" class="row-label">Small record</text><line x1="339.85" y1="215" x2="560.00" y2="215" stroke="#08766F" stroke-width="3" /><circle cx="339.85" cy="215" r="6" fill="#08766F"><title>Small record encode: Rust core 202 ns/op; Python dCBOR 1,476 ns/op; Rust/Python 0.1366×</title></circle><text x="836" y="220" class="ratio-value" fill="#08766F">0.14×</text><text x="48" y="249" class="row-label">Nested document</text><line x1="358.38" y1="244" x2="560.00" y2="244" stroke="#08766F" stroke-width="3" /><circle cx="358.38" cy="244" r="6" fill="#08766F"><title>Nested document encode: Rust core 562 ns/op; Python dCBOR 3,476 ns/op; Rust/Python 0.1616×</title></circle><text x="836" y="249" class="ratio-value" fill="#08766F">0.16×</text><text x="48" y="278" class="row-label">Repeated Unicode strings</text><line x1="416.01" y1="273" x2="560.00" y2="273" stroke="#08766F" stroke-width="3" /><circle cx="416.01" cy="273" r="6" fill="#08766F"><title>Repeated Unicode strings encode: Rust core 13,155 ns/op; Python dCBOR 48,360 ns/op; Rust/Python 0.2720×</title></circle><text x="836" y="278" class="ratio-value" fill="#08766F">0.27×</text><text x="48" y="307" class="row-label">Numeric array</text><line x1="411.22" y1="302" x2="560.00" y2="302" stroke="#08766F" stroke-width="3" /><circle cx="411.22" cy="302" r="6" fill="#08766F"><title>Numeric array encode: Rust core 2,815 ns/op; Python dCBOR 10,804 ns/op; Rust/Python 0.2605×</title></circle><text x="836" y="307" class="ratio-value" fill="#08766F">0.26×</text><text x="48" y="336" class="row-label">Compact scientific notation</text><line x1="366.41" y1="331" x2="560.00" y2="331" stroke="#08766F" stroke-width="3" /><circle cx="366.41" cy="331" r="6" fill="#08766F"><title>Compact scientific notation encode: Rust core 49 ns/op; Python dCBOR 281 ns/op; Rust/Python 0.1737×</title></circle><text x="836" y="336" class="ratio-value" fill="#08766F">0.17×</text><text x="48" y="365" class="row-label">Large collection</text><line x1="374.79" y1="360" x2="560.00" y2="360" stroke="#08766F" stroke-width="3" /><circle cx="374.79" cy="360" r="6" fill="#08766F"><title>Large collection encode: Rust core 33,456 ns/op; Python dCBOR 178,533 ns/op; Rust/Python 0.1874×</title></circle><text x="836" y="365" class="ratio-value" fill="#08766F">0.19×</text><text x="48" y="394" class="row-label">Telemetry batch</text><line x1="372.74" y1="389" x2="560.00" y2="389" stroke="#08766F" stroke-width="3" /><circle cx="372.74" cy="389" r="6" fill="#08766F"><title>Telemetry batch encode: Rust core 17,966 ns/op; Python dCBOR 97,659 ns/op; Rust/Python 0.1840×</title></circle><text x="836" y="394" class="ratio-value" fill="#08766F">0.18×</text><text x="48" y="423" class="row-label">ASCII article</text><line x1="392.88" y1="418" x2="560.00" y2="418" stroke="#08766F" stroke-width="3" /><circle cx="392.88" cy="418" r="6" fill="#08766F"><title>ASCII article encode: Rust core 457 ns/op; Python dCBOR 2,070 ns/op; Rust/Python 0.2207×</title></circle><text x="836" y="423" class="ratio-value" fill="#08766F">0.22×</text><text x="48" y="511" class="operation">Decode</text><text x="836" y="511" class="column-head">Rust core / Python ratio</text><line x1="48" y1="796" x2="1072" y2="796" class="rule" /><line x1="330.00" y1="523" x2="330.00" y2="791" stroke="#E0E7EA" stroke-width="1" stroke-dasharray="2 5" /><text x="330.00" y="538" text-anchor="middle" class="axis">0.12×</text><line x1="483.33" y1="523" x2="483.33" y2="791" stroke="#E0E7EA" stroke-width="1" stroke-dasharray="2 5" /><text x="483.33" y="538" text-anchor="middle" class="axis">0.5×</text><line x1="560.00" y1="523" x2="560.00" y2="791" stroke="#142B39" stroke-width="2" stroke-dasharray="0" /><text x="560.00" y="538" text-anchor="middle" class="axis">1×</text><line x1="636.67" y1="523" x2="636.67" y2="791" stroke="#E0E7EA" stroke-width="1" stroke-dasharray="2 5" /><text x="636.67" y="538" text-anchor="middle" class="axis">2×</text><line x1="790.00" y1="523" x2="790.00" y2="791" stroke="#E0E7EA" stroke-width="1" stroke-dasharray="2 5" /><text x="790.00" y="538" text-anchor="middle" class="axis">8×</text><text x="48" y="555" class="row-label">Small record</text><line x1="482.37" y1="550" x2="560.00" y2="550" stroke="#08766F" stroke-width="3" /><circle cx="482.37" cy="550" r="6" fill="#08766F"><title>Small record decode: Rust core 438 ns/op; Python dCBOR 883 ns/op; Rust/Python 0.4957×</title></circle><text x="836" y="555" class="ratio-value" fill="#08766F">0.50×</text><text x="48" y="584" class="row-label">Nested document</text><line x1="499.41" y1="579" x2="560.00" y2="579" stroke="#08766F" stroke-width="3" /><circle cx="499.41" cy="579" r="6" fill="#08766F"><title>Nested document decode: Rust core 1,200 ns/op; Python dCBOR 2,075 ns/op; Rust/Python 0.5782×</title></circle><text x="836" y="584" class="ratio-value" fill="#08766F">0.58×</text><text x="48" y="613" class="row-label">Repeated Unicode strings</text><line x1="516.31" y1="608" x2="560.00" y2="608" stroke="#08766F" stroke-width="3" /><circle cx="516.31" cy="608" r="6" fill="#08766F"><title>Repeated Unicode strings decode: Rust core 21,399 ns/op; Python dCBOR 31,764 ns/op; Rust/Python 0.6737×</title></circle><text x="836" y="613" class="ratio-value" fill="#08766F">0.67×</text><text x="48" y="642" class="row-label">Numeric array</text><line x1="498.58" y1="637" x2="560.00" y2="637" stroke="#08766F" stroke-width="3" /><circle cx="498.58" cy="637" r="6" fill="#08766F"><title>Numeric array decode: Rust core 5,523 ns/op; Python dCBOR 9,624 ns/op; Rust/Python 0.5739×</title></circle><text x="836" y="642" class="ratio-value" fill="#08766F">0.57×</text><text x="48" y="671" class="row-label">Compact scientific notation</text><line x1="408.33" y1="666" x2="560.00" y2="666" stroke="#08766F" stroke-width="3" /><circle cx="408.33" cy="666" r="6" fill="#08766F"><title>Compact scientific notation decode: Rust core 56 ns/op; Python dCBOR 221 ns/op; Rust/Python 0.2538×</title></circle><text x="836" y="671" class="ratio-value" fill="#08766F">0.25×</text><text x="48" y="700" class="row-label">Large collection</text><line x1="522.92" y1="695" x2="560.00" y2="695" stroke="#08766F" stroke-width="3" /><circle cx="522.92" cy="695" r="6" fill="#08766F"><title>Large collection decode: Rust core 109,221 ns/op; Python dCBOR 152,723 ns/op; Rust/Python 0.7152×</title></circle><text x="836" y="700" class="ratio-value" fill="#08766F">0.72×</text><text x="48" y="729" class="row-label">Telemetry batch</text><line x1="525.39" y1="724" x2="560.00" y2="724" stroke="#08766F" stroke-width="3" /><circle cx="525.39" cy="724" r="6" fill="#08766F"><title>Telemetry batch decode: Rust core 64,373 ns/op; Python dCBOR 88,025 ns/op; Rust/Python 0.7313×</title></circle><text x="836" y="729" class="ratio-value" fill="#08766F">0.73×</text><text x="48" y="758" class="row-label">ASCII article</text><line x1="531.36" y1="753" x2="560.00" y2="753" stroke="#08766F" stroke-width="3" /><circle cx="531.36" cy="753" r="6" fill="#08766F"><title>ASCII article decode: Rust core 2,901 ns/op; Python dCBOR 3,758 ns/op; Rust/Python 0.7719×</title></circle><text x="836" y="758" class="ratio-value" fill="#08766F">0.77×</text>
  <text x="48" y="829" class="caption">Whole-operation comparison: Python conversion included; Rust trees prepared. Not an isolated FFI benchmark. Process samples and MAD remain in raw JSON.</text>
</svg>
