name: Build, test, and release

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full_matrix:
        description: Request full coverage for non-PR callers (PRs remain reduced)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Docs-only pushes must not cancel or replace a run validating earlier code.
  group: wheels-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: '2'
  RUST_VERSION: '1.90.0'

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
      full_matrix: ${{ steps.plan.outputs.full_matrix }}
      wheel_matrix: ${{ steps.plan.outputs.wheel_matrix }}
      linux_image_mode: ${{ steps.plan.outputs.linux_image_mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan coverage and image policy
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          FULL_MATRIX_REQUESTED: ${{ inputs.full_matrix || false }}
        run: python3 scripts/ci_plan.py >> "$GITHUB_OUTPUT"
      - name: Check changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_MATRIX: ${{ steps.plan.outputs.full_matrix }}
        run: |
          if [[ "$FULL_MATRIX" == "true" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files=$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            changed_files=$(git diff --name-only "$BEFORE_SHA..$HEAD_SHA")
          else
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/ci_paths.py <<< "$changed_files" >> "$GITHUB_OUTPUT"

  metadata:
    name: Check package and release versions
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python scripts/ci.py versions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - name: Read package version
        id: package-version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test Python ${{ matrix.python }}
    needs: [changes, metadata]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Select Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Build and install extension for tests
        run: |
          python -m pip install 'maturin>=1.7,<2' 'pytest>=8,<9'
          maturin build --locked --out test-wheels
          python -m pip install --no-deps test-wheels/*.whl
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
      - name: Run exhaustive suite on the representative interpreter
        if: matrix.python == '3.14'
        run: python -m pytest -q
      - name: Run cross-interpreter suite
        if: matrix.python != '3.14'
        run: python -m pytest -q -m "not exhaustive"

  rust:
    name: Test vendored Rust codec
    needs: [changes, metadata]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Run codec tests with the committed lockfile
        run: cargo test --manifest-path crates/dcbor/Cargo.toml --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}

  sdist:
    name: Build and test source distribution
    needs: [changes, metadata]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Select Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Package source and rebuild it in isolation
        run: |
          python -m pip install 'build>=1,<2' 'pytest>=8,<9'
          python -m build --sdist --outdir dist
          python -m pip install --no-deps dist/*.tar.gz
          python -m pytest -q
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  wheels:
    name: Wheels on ${{ matrix.os }} for ${{ matrix.python }}
    needs: [changes, sdist]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.wheel_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Select native Rust toolchain
        if: runner.os != 'Linux'
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Locate source archive
        id: source
        run: |
          archives=(dist/*.tar.gz)
          test "${#archives[@]}" -eq 1
          echo "path=${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Select Linux image mode
        if: runner.os == 'Linux'
        env:
          IMAGE_MODE: ${{ needs.changes.outputs.linux_image_mode }}
        run: |
          python scripts/ci_linux_images.py "$IMAGE_MODE" >> "$GITHUB_ENV"
          echo "Linux image mode: $IMAGE_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "LINUX_IMAGE_MODE=$IMAGE_MODE" >> "$GITHUB_ENV"
      - name: Pull and validate the exact maintained image digests
        if: runner.os == 'Linux' && env.LINUX_IMAGE_MODE == 'maintained'
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          manylinux="$CIBW_MANYLINUX_X86_64_IMAGE"
          musllinux="$CIBW_MUSLLINUX_X86_64_IMAGE"
          for family in manylinux_2_28 musllinux_1_2; do
            if [[ "$family" == manylinux_2_28 ]]; then image="$manylinux"; else image="$musllinux"; fi
            echo "Validating $image at $(date -u +%FT%TZ)"
            docker pull "$image"
            docker run --rm \
              --volume "$PWD/containers/linux/validate-image.sh:/validate-image.sh:ro" \
              "$image" bash /validate-image.sh "$family" "$(uname -m)"
            echo "Validated: \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Build, repair, and test every wheel from the source archive
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: ${{ steps.source.outputs.path }}
          output-dir: wheelhouse
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
          CIBW_BUILD: ${{ matrix.python }}-*
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  macos-wheels:
    name: Wheels on ${{ matrix.os }} for ${{ matrix.python }}
    if: needs.changes.outputs.full_matrix == 'true' && needs.changes.outputs.code_changed == 'true'
    needs: [changes, sdist]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14]
        python: ['cp39', 'cp310', 'cp311', 'cp312', 'cp313', 'cp314']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Select native Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Locate source archive
        id: source
        run: |
          archives=(dist/*.tar.gz)
          test "${#archives[@]}" -eq 1
          echo "path=${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Build, repair, and test every wheel from the source archive
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: ${{ steps.source.outputs.path }}
          output-dir: wheelhouse
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
          CIBW_BUILD: ${{ matrix.python }}-*
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  distributions:
    name: Validate complete release bundle
    if: needs.changes.outputs.full_matrix == 'true' && needs.changes.outputs.code_changed == 'true'
    needs: [changes, metadata, test, rust, sdist, wheels, macos-wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - run: |
          python -m pip install 'twine>=6,<7' 'packaging>=24'
          python -m twine check --strict dist/*
          python scripts/ci.py distributions dist
      - name: Record release bundle provenance
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = {
              "version": os.environ["RELEASE_VERSION"],
              "commit_sha": os.environ["RELEASE_COMMIT"],
              "run_id": int(os.environ["RELEASE_RUN_ID"]),
          }
          Path("dist/BUILD-PROVENANCE.json").write_text(
              json.dumps(provenance, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-v${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
