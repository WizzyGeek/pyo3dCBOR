name: Build, test, and release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # PRs and branch pushes share a ref-scoped group; tags and manual runs stay isolated.
  group: wheels-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')) && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  RUST_VERSION: '1.90.0'

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files=$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            changed_files=$(git diff --name-only "$BEFORE_SHA..$HEAD_SHA")
          else
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/ci_paths.py <<< "$changed_files" >> "$GITHUB_OUTPUT"

  metadata:
    name: Check package and release versions
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install 'pytest>=8,<9'
      - name: Verify version and changed-path guards
        run: python -m pytest -q tests/test_ci_version.py tests/test_ci_paths.py
      - run: python scripts/ci.py versions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

  test:
    name: Test Python ${{ matrix.python }}
    needs: [changes, metadata]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Select Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Build and install extension for tests
        run: |
          python -m pip install 'maturin>=1.7,<2' 'pytest>=8,<9'
          maturin build --locked --out test-wheels
          python -m pip install --no-deps test-wheels/*.whl
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
      - name: Run exhaustive suite on the representative interpreter
        if: matrix.python == '3.14'
        run: python -m pytest -q
      - name: Run cross-interpreter suite
        if: matrix.python != '3.14'
        run: python -m pytest -q -m "not exhaustive"

  rust:
    name: Test vendored Rust codec
    needs: [changes, metadata]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Run codec tests with the committed lockfile
        run: cargo test --manifest-path crates/dcbor/Cargo.toml --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}

  sdist:
    name: Build and test source distribution
    needs: [changes, metadata]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Select Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Package source and rebuild it in isolation
        run: |
          python -m pip install 'build>=1,<2' 'pytest>=8,<9'
          python -m build --sdist --outdir dist
          python -m pip install --no-deps dist/*.tar.gz
          python -m pytest -q
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  wheels:
    name: Wheels on ${{ matrix.os }} for ${{ matrix.python }}
    needs: [changes, sdist]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.event_name == 'push' && github.ref_type == 'tag')) && fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","windows-2022"]') || fromJSON('["ubuntu-latest"]') }}
        python: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.event_name == 'push' && github.ref_type == 'tag')) && fromJSON('["cp39","cp310","cp311","cp312","cp313","cp314"]') || fromJSON('["cp312","cp313","cp314"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Select native Rust toolchain
        if: runner.os != 'Linux'
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Locate source archive
        id: source
        run: |
          archives=(dist/*.tar.gz)
          test "${#archives[@]}" -eq 1
          echo "path=${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Build, repair, and test every wheel from the source archive
        uses: pypa/cibuildwheel@v4.3.1
        with:
          package-dir: ${{ steps.source.outputs.path }}
          output-dir: wheelhouse
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
          CIBW_BUILD: ${{ matrix.python }}-*
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  macos-wheels:
    name: Wheels on ${{ matrix.os }} for ${{ matrix.python }}
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.event_name == 'push' && github.ref_type == 'tag')) && needs.changes.outputs.code_changed == 'true'
    needs: [changes, sdist]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14]
        python: ['cp39', 'cp310', 'cp311', 'cp312', 'cp313', 'cp314']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Select native Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Locate source archive
        id: source
        run: |
          archives=(dist/*.tar.gz)
          test "${#archives[@]}" -eq 1
          echo "path=${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Build, repair, and test every wheel from the source archive
        uses: pypa/cibuildwheel@v4.3.1
        with:
          package-dir: ${{ steps.source.outputs.path }}
          output-dir: wheelhouse
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
          CIBW_BUILD: ${{ matrix.python }}-*
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  distributions:
    name: Validate complete release bundle
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.event_name == 'push' && github.ref_type == 'tag')) && needs.changes.outputs.code_changed == 'true'
    needs: [changes, test, rust, sdist, wheels, macos-wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - run: |
          python -m pip install 'twine>=6,<7' 'packaging>=24'
          python -m twine check --strict dist/*
          python scripts/ci.py distributions dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist
      - name: Publish tested assets
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GH_REPO" --verify-tag --generate-notes \
            --title "dcbor $RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
