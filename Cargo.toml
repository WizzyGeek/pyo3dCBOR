[package]
name = "dcbor-py"
version = "0.1.1"
edition = "2021"
description = "Native deterministic CBOR (dCBOR) implementation with Python bindings"
license = "BSD-2-Clause-Patent"
repository = "https://github.com/WizzyGeek/pyo3dCBOR"
homepage = "https://github.com/WizzyGeek/pyo3dCBOR"

[lib]
name = "_dcbor"
crate-type = ["cdylib"]

[dependencies]
unicode-normalization = "0.1"
half = "2.7"

[dependencies.pyo3]
version = "0.29"

[profile.release]
lto = true
